actions:
  - index: 0
    name: return
    type: dir
    icon: back

  - index: 1
    name: wind_minus_10kts
    type: single
    icon: wind_low
    command: WeisAIR/ops_weather/dec_wind_10kts
    special-labels:
      - label: -10 kts
        text-center:
          x: center
          y: 85
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center

  - index: 2
    name: wind_speed_knots
    type: none
    dataref: sim/weather/aircraft/wind_speed_kts[0] #sim/cockpit2/gauges/indicators/wind_speed_kts
    display:
      name: display_wind_speed_knots
      text-center:
        x: center
        y: 70 # center doesn't work as it should, due to font's height
      font-path: IBMPlexMono-Bold.ttf
      font-size: 20
      zero-pad: False
      min: 0
      max: 100
      step: 1
      color: lime
      keep-decimal: False
      background: none
    special-labels:
      - label: Wind
        text-center:
          x: center
          y: 15
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center
      - label: Speed
        text-center:
          x: center
          y: 31
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center
      - label: (kts)
        text-center:
          x: center
          y: 47
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center   

  - index: 3
    name: wind_plus_10kts
    type: single
    icon: wind_high
    command: WeisAIR/ops_weather/inc_wind_10kts
    special-labels:
      - label: +10 kts
        text-center:
          x: center
          y: 85
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center

  - index: 5
    name: time_hours
    type: none
    dataref: sim/cockpit2/clock_timer/local_time_hours 
    display:
      name: display_time_hours
      text-center:
        x: center
        y: 60
      font-path: IBMPlexMono-Bold.ttf
      font-size: 40
      zero-pad: False
      min: 0
      max: 360
      step: 1
      color: lime
      keep-decimal: False
      background: background

  - index: 6
    name: time_min
    type: none
    dataref: sim/cockpit2/clock_timer/local_time_minutes 
    display:
      name: display_time_hours
      text-center:
        x: center
        y: 60
      font-path: IBMPlexMono-Bold.ttf
      font-size: 40
      zero-pad: False
      min: 0
      max: 360
      step: 1
      color: lime
      keep-decimal: False
      background: background

  - index: 7
    name: time_seconds
    type: none
    dataref: sim/cockpit2/clock_timer/local_time_seconds 
    display:
      name: display_time_hours
      text-center:
        x: center
        y: 60 
      font-path: IBMPlexMono-Bold.ttf
      font-size: 40
      zero-pad: False
      min: 0
      max: 360
      step: 1
      color: lime
      keep-decimal: False
      background: background

  - index: 8
    name: rel_wind_dir
    type: none
    dataref: WeisAIR/environment/wind_heading_relative_to_aircraft
    gauge:
      name: rel_wind_dir_gauge
      needle-center:
        x: 64
        y: 64
      background: just_black
      needle: wind_needle
      range-degrees: 360
      min: 0
      max: 359
      step: 1

  - index: 9
    name: wind_dir_minus_10degr
    type: single
    icon: windsock_left
    command: WeisAIR/ops_weather/dec_wind_direction_10degr
    special-labels:
      - label: -10 degr
        text-center:
          x: center
          y: 85
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center

  - index: 10
    name: wind_heading_deg_mag
    type: none
    dataref: sim/cockpit2/gauges/indicators/wind_heading_deg_mag #sim/cockpit2/gauges/indicators/wind_speed_kts
    display:
      name: display_wind_heading_deg_mag
      text-center:
        x: center
        y: 70 # center doesn't work as it should, due to font's height
      font-path: IBMPlexMono-Bold.ttf
      font-size: 20
      zero-pad: False
      min: 0
      max: 360
      step: 1
      color: lime
      keep-decimal: False
      background: background
    special-labels:
      - label: Wind
        text-center:
          x: center
          y: 15
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center
      - label: Direction
        text-center:
          x: center
          y: 31
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center
      - label: (Degr)
        text-center:
          x: center
          y: 47
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center   

  - index: 11
    name: wind_dir_plus_10degr
    type: single
    icon: windsock_right
    command: WeisAIR/ops_weather/inc_wind_direction_10degr
    special-labels:
      - label: +10 degr
        text-center:
          x: center
          y: 85
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center

  - index: 13
    name: time_minus_60mins
    type: single
    icon: clock_minus1h
    command: WeisAIR/ops_time/set_zulutime_prev_hour
    label: ""

  - index: 15
    name: time_plus_60mins
    type: single
    icon: clock_plus1h
    command: WeisAIR/ops_time/set_zulutime_next_hour
    label: ""

  - index: 17
    name: rwy_friction
    type: none
    file-names:
      - rwy_dry
      - rwy_wet1
      - rwy_wet2
      - rwy_wet3
      - rwy_puddly1
      - rwy_puddly2
      - rwy_puddly3
