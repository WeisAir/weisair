actions:
  - index: 0
    name: return
    type: dir
    icon: back

  - index: 1
    name: wind_minus_10kts
    type: single
    icon: wind_low
    command: WeisAIR/ops_weather/dec_wind_10kts
    special-labels:
      - label: -10 kts
        text-center:
          x: center
          y: 50
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center

  - index: 2
    name: wind_speed_knots
    type: none
    dataref: sim/cockpit2/gauges/indicators/wind_speed_kts
    display:
      name: display_wind_speed_knots
      text-center:
        x: center
        y: 70 # center doesn't work as it should, due to font's height
      font-path: IBMPlexMono-Bold.ttf
      font-size: 20
      zero-pad: False
      min: 0
      max: 100
      step: 1
      color: lime
      keep-decimal: False
      background: none
    special-labels:
      - label: Wind
        text-center:
          x: center
          y: 10
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center
      - label: Speed
        text-center:
          x: center
          y: 26
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center
      - label: (kts)
        text-center:
          x: center
          y: 42
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center   

  - index: 3
    name: wind_plus_10kts
    type: single
    icon: wind_high
    command: WeisAIR/ops_weather/inc_wind_10kts
    special-labels:
      - label: +10 kts
        text-center:
          x: center
          y: 50
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center

  - index: 9
    name: wind_dir_minus_10degr
    type: single
    icon: windsock_left
    command: WeisAIR/ops_weather/dec_wind_direction_10degr
    special-labels:
      - label: -10 degr
        text-center:
          x: center
          y: 50
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center

  - index: 11
    name: wind_dir_plus_10degr
    type: single
    icon: windsock_right
    command: WeisAIR/ops_weather/inc_wind_direction_10degr
    special-labels:
      - label: +10 degr
        text-center:
          x: center
          y: 50
        font-path: IBMPlexMono-Bold.ttf
        font-size: 16
        color: white
        direction: ltr
        align: center

  - index: 13
    name: time_minus_60mins
    type: single
    icon: clock_minus1h
    command: WeisAIR/ops_time/set_zulutime_prev_hour
    label: ""

  - index: 15
    name: time_plus_60mins
    type: single
    icon: clock_plus1h
    command: WeisAIR/ops_time/set_zulutime_next_hour
    label: ""

  - index: 17
    name: rwy_friction
    type: single
    file-names:
      - rwy_dry
      - rwy_wet1
      - rwy_wet2
      - rwy_wet3
      - rwy_puddly1
      - rwy_puddly2
      - rwy_puddly3
