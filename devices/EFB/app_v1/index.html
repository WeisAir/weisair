<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mini Browser Hub</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; }
        .btn { display: inline-block; padding: 15px 30px; margin: 10px; font-size: 18px; color: white; background: #007BFF; text-decoration: none; border-radius: 5px; transition: background 0.2s; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Mein lightweight Web-Hub</h1>
    <!-- Das 'target'-Attribut sorgt dafür, dass die Seite immer im exakt selben Tab bleibt -->
    <a href="https://example.com" target="page_a" class="btn">Seite A anzeigen</a>
    <a href="https://wikipedia.org" target="page_b" class="btn">Seite B anzeigen</a>
    <a href="https://github.com" target="page_c" class="btn">Seite C anzeigen</a>
</body>
</html>
