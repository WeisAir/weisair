<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EFB Website Launcher</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
		body { display: flex; background: #111827; font-family: system-ui, sans-serif; }
		#website-area { position: relative; flex: 0 0 90%; width: 90%; height: 100%; background: white; }
		webview { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: white; }
		.hidden { display: none !important; }
		#checklist-view { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: white; }
		#checklist-message {
			position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
			padding: 24px; color: #374151; background: white; font-size: 24px; text-align: center;
		}
		#button-bar {
			flex: 0 0 10%; width: 10%; min-width: 90px; padding: 10px;
			display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
			background: var(--button-area-background, #1f2937); border-left: 1px solid #374151;
		}
		#brand-logo {
			flex: 0 0 auto; width: 100%; height: auto; max-height: 90px;
			object-fit: contain; object-position: top center;
		}
		#logo-spacer {
			flex: 0 0 auto; height: var(--logo-height, 90px);
			display: flex; flex-direction: column; justify-content: center; align-items: center;
			color: #e5e7eb;
			font-size: 24px; font-weight: 600;
		}
		#aircraft-name { font-size: 14px; font-weight: 400; text-align: center; overflow-wrap: anywhere; }
		#website-buttons { display: flex; flex-direction: column; gap: 8px; }
		.website-button {
			height: var(--button-height, 48px);
			font-size: var(--button-font-size, 16px);
			white-space: normal; overflow-wrap: anywhere; word-break: break-word;
		}
		button {
			width: 100%; padding: 10px 6px; border: 1px solid #4b5563;
			border-radius: 6px; color: #e5e7eb; background: var(--inactive-button-color, #374151);
			cursor: pointer; font: inherit; overflow-wrap: anywhere;
		}
		button:hover, button.active { background: var(--active-button-color, #2563eb); border-color: #60a5fa; }
		#status { margin: auto 2px 0; color: #9ca3af; font-size: 11px; text-align: center; }
		#airmanager-toggle { margin-top: auto; }
		#airmanager-toggle.running { background: var(--active-button-color, #2563eb); }
		#close-button { margin-top: auto; padding: 8px; font-size: 24px; line-height: 1; text-align: center; }
		#close-button { margin-top: var(--airmanager-exit-spacing, 8px); }
	</style>
</head>
<body>
	<section id="website-area" aria-label="Website area">
		<webview id="checklist-view" class="hidden" partition="persist:efb-hub" title="Checklists"></webview>
		<div id="checklist-message" class="hidden">Checklist not found or configured file path is invalid</div>
	</section>
	<nav id="button-bar" aria-label="Websites">
		<img id="brand-logo" src="ressources/v1.png" alt="WESAIR">
		<div id="logo-spacer"><div>EFB</div><div id="aircraft-name">X-Plane offline</div></div>
		<div id="website-buttons"></div>
		<button id="checklist-button" class="website-button" type="button">Checklists</button>
		<button id="airmanager-toggle" type="button" aria-pressed="false">AirManager: OFF</button>
		<button id="close-button" type="button" aria-label="Close application" title="Close application">EXIT</button>
	</nav>
	<script src="renderer.js"></script>
</body>
</html>
